# TEMPORARY — goes at .github/workflows/schema-probe.yml
#
# Manual-only. Prints the Shapes schema fragments for offices / public holidays
# so roll-call.js can be extended to report holiday absences (e.g. Simona,
# N. Macedonia office). Delete this file and scripts/schema-probe.js once the
# holiday query in roll-call.js is settled.
#
# Read-only against Shapes: introspection queries only, no mutations except the
# unavoidable token refresh.

name: Schema Probe (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe schema
        id: probe
        env:
          SHAPES_REFRESH_TOKEN: ${{ secrets.SHAPES_REFRESH_TOKEN }}
        run: node scripts/schema-probe.js

      # Refreshing the access token can rotate the refresh token. If we don't
      # persist the new one, tomorrow's Roll Call fails with an auth error.
      # Mirrors the same step in roll-call.yml.
      - name: Persist rotated refresh token
        if: steps.probe.outputs.rotated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.probe.outputs.new_refresh_token }}
        run: |
          echo "Rotating stored SHAPES_REFRESH_TOKEN."
          gh secret set SHAPES_REFRESH_TOKEN \
            --repo "${{ github.repository }}" \
            --body "$NEW_TOKEN"
